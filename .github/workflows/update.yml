name: Update dependencies

on:
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:

permissions: {}

env:
  NIX_CONF: |
    extra-substituters = https://cache.numtide.com https://verbatime.cachix.org https://ajmx.cachix.org https://yagipass.cachix.org
    extra-trusted-public-keys = niks3.numtide.com-1:DTx8wZduET09hRmMtKdQDxNNthLQETkc/yaX7M4qK0g= verbatime.cachix.org-1:Qqie2fyx4q6SYyjWuwmkr78fNAizxW1acBKeiAcHql8= ajmx.cachix.org-1:GIHBWC7DAYdQHwsuTKF6ouPF0ziSXtxRcktMOr4xXMk= yagipass.cachix.org-1:IDx7B73P4TC7rE854lIYEwy/gd73PV3KE51tIV0vXOc=

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      body: ${{ steps.update.outputs.body }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: nixbuild/nix-quick-install-action@v35
        with:
          nix_conf: ${{ env.NIX_CONF }}

      - name: Update every input
        id: update
        run: |
          set -euo pipefail
          source .github/scripts/version-table.sh

          cp flake.lock "$RUNNER_TEMP/flake.lock.before"
          before=$(package_versions)

          nix develop --command just update-all

          after=$(package_versions)
          inputs=$(input_rows "$RUNNER_TEMP/flake.lock.before" flake.lock)
          packages=$(package_rows "$before" "$after")
          {
            echo "body<<EOF"
            # shellcheck disable=SC2016
            version_body 'Automated `just update-all`: `nix flake update`, npm packages, and JDK Mission Control.' "$inputs" "$packages"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Save the changes as a patch
        run: |
          git add --all
          git diff --cached --binary > "$RUNNER_TEMP/update.patch"

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: update-patch
          path: ${{ runner.temp }}/update.patch
          if-no-files-found: error
          retention-days: 1

  pull-request:
    needs: update
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8.0.2
        with:
          name: update-patch
          path: ${{ runner.temp }}/update

      - name: Apply the changes
        run: |
          patch="$RUNNER_TEMP/update/update.patch"
          if [[ -s $patch ]]; then
            git apply "$patch"
          fi

      - uses: peter-evans/create-pull-request@v8.1.1
        id: pr
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: chore/update-dependencies
          delete-branch: true
          commit-message: "chore: update dependencies"
          title: "chore: update dependencies"
          labels: |
            automated
            dependencies
          body: ${{ needs.update.outputs.body }}

      - name: Trigger CI
        if: steps.pr.outputs.pull-request-operation == 'created' || steps.pr.outputs.pull-request-operation == 'updated'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BRANCH: ${{ steps.pr.outputs.pull-request-branch }}
        run: gh workflow run ci.yml --ref "$PR_BRANCH"
