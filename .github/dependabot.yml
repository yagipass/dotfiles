version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci"
    labels:
      - automated
      - dependencies
    groups:
      github-actions:
        patterns:
          - "*"
