onboarding = false

[update]
version_check = false
manifest_check = false

[keys]
focus_agent = "prefix+alt+1..9"
resize_pane_left = "prefix+alt+h"
resize_pane_down = "prefix+alt+j"
resize_pane_up = "prefix+alt+k"
resize_pane_right = "prefix+alt+l"

[[keys.command]]
key = "prefix+t"
type = "popup"
command = "zsh"
description = "popup terminal"
width = "80%"
height = "80%"
